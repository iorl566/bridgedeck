<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>快捷功能 · BridgeDeck</title>
  <link rel="stylesheet" href="ui.css" />
<script type="module" src="i18n.js"></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <button id="back" class="back-btn" title="返回">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg>
      </button>
      <h1>快捷功能</h1>
    </header>

    <div class="entries">
      <button class="entry" data-page="record">
        <span class="entry-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-6l2 3h-2l-2-3-2 3H8l2-3H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm8 3.5 4 2.5-4 2.5v-5Z"/></svg>
        </span>
        <span class="entry-body">
          <span class="entry-title">视频录制</span>
          <span class="entry-sub">将任务标签页录制为 MP4 视频</span>
        </span>
        <span class="chevron">›</span>
      </button>

      <button class="entry" data-page="debug">
        <span class="entry-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20 8h-2.81a5.99 5.99 0 0 0-1.7-1.7L17 4.66 15.66 3.3l-2.2 2.2a6.4 6.4 0 0 0-3.42 0L7.84 3.3 6.5 4.66l1.52 1.64A5.99 5.99 0 0 0 6.3 8H3.5v2h2.2c-.1.5-.1 1 0 1.5H3.5v2h2.2a6 6 0 0 0 11.6 0h2.2v-2h-2.2c.1-.5.1-1 0-1.5H20V8Z"/></svg>
        </span>
        <span class="entry-body">
          <span class="entry-title">网站调试</span>
          <span class="entry-sub">记录请求、异常与页面上下文，随时回看</span>
        </span>
        <span class="chevron">›</span>
      </button>

      <button class="entry" data-page="longshot">
        <span class="entry-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 3h16v2H4V3Zm0 4h16v10H4V7Zm2 2v6h12V9H6Zm-2 8h16v2H4v-2Z"/></svg>
        </span>
        <span class="entry-body">
          <span class="entry-title">长截图</span>
          <span class="entry-sub">从网页顶部截到底部，预览并保存长图</span>
        </span>
        <span class="chevron">›</span>
      </button>

      <button class="entry" data-page="ops">
        <span class="entry-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 3a7 7 0 0 1 7 7 7 7 0 0 1-7 7V5Z"/></svg>
        </span>
        <span class="entry-body">
          <span class="entry-title">操作录制</span>
          <span class="entry-sub">录制你的操作，供 Agent 参考</span>
        </span>
        <span class="chevron">›</span>
      </button>

      <button class="entry" data-page="audit">
        <span class="entry-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 10.41 3.3 3.3-1.42 1.41L11 13.24V6h2v6.41Z"/></svg>
        </span>
        <span class="entry-body">
          <span class="entry-title">操作审计</span>
          <span class="entry-sub">操作审计介绍</span>
        </span>
        <span class="chevron">›</span>
      </button>
    </div>
  </main>
  <script type="module" src="quick.js"></script>
</body>
</html>
