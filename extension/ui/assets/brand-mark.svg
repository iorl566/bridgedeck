<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="BridgeDeck">
  <defs>
    <linearGradient id="bdGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d7bff"/>
      <stop offset="1" stop-color="#1f4fd0"/>
    </linearGradient>
    <linearGradient id="bdGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#bdGrad)"/>
  <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#bdGloss)"/>
  <!-- 桥面 -->
  <path d="M4.6 24.5h22.8" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 更长桥墩（桥面到拱脚） -->
  <path d="M8.9 24.5V13.2" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M23.1 24.5V13.2" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 桥拱（无节点立杆） -->
  <path d="M8.9 13.2c2.1-3.7 4.9-5.5 7.1-5.5s5 1.8 7.1 5.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 吊杆 -->
  <path d="M12.6 24.5v-3.9M19.4 24.5v-3.9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>