name: Release CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.1.2)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "tag $TAG does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
      HAS_APPLE_INSTALLER: ${{ secrets.APPLE_INSTALLER_IDENTITY != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            ext: zip
          - os: macos-latest
            platform: darwin
            arch: arm64
            ext: tar.gz
          - os: macos-latest
            platform: darwin
            arch: x64
            ext: tar.gz
          - os: ubuntu-latest
            platform: linux
            arch: x64
            ext: tar.gz
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            ext: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Stage package
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          node tools/package-portable.mjs --stage-only --json \
            --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" > stage.json
          node -e "process.stdout.write(require('./stage.json').stage)" > stage.path
          echo "STAGE=$(cat stage.path)" >> "$GITHUB_ENV"

      - name: Import Apple certificate
        if: matrix.platform == 'darwin' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Sign Mach-O binaries
        if: matrix.platform == 'darwin' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: bash tools/sign-macos.sh --dir "$STAGE" --identity "$APPLE_SIGN_IDENTITY"

      - name: Package archive
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          OUT="dist/BridgeDeck-cli-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.ext }}"
          node tools/package-portable.mjs --pack-dir "$STAGE" \
            --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --out "$OUT"

      - name: Build macOS installer package
        if: matrix.platform == 'darwin' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          OUT="dist/BridgeDeck-${VERSION}-darwin-${{ matrix.arch }}.pkg"
          if [ -n "${APPLE_INSTALLER_IDENTITY:-}" ]; then
            bash tools/build-macos-pkg.sh --stage "$STAGE" --version "$VERSION" --out "$OUT" \
              --identity-installer "$APPLE_INSTALLER_IDENTITY"
          else
            bash tools/build-macos-pkg.sh --stage "$STAGE" --version "$VERSION" --out "$OUT"
          fi

      - name: Notarize macOS package
        if: matrix.platform == 'darwin' && env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_INSTALLER == 'true' && env.HAS_APPLE_NOTARY == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          bash tools/notarize-macos.sh --file "dist/BridgeDeck-${VERSION}-darwin-${{ matrix.arch }}.pkg" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: Remove stage
        if: always()
        shell: bash
        run: |
          if [ -n "${STAGE:-}" ] && [ -d "$STAGE" ]; then rm -rf "$STAGE"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/BridgeDeck-cli-*.zip
            dist/BridgeDeck-cli-*.tar.gz
            dist/BridgeDeck-*.pkg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release manifest
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SIGN_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_PRIVATE_KEY:-}" ]; then
            case "$SIGNING_PRIVATE_KEY" in
              -----BEGIN*) printf '%s' "$SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/release-private.pem" ;;
              *) printf '%s' "$SIGNING_PRIVATE_KEY" | base64 -d > "$RUNNER_TEMP/release-private.pem" ;;
            esac
            node tools/release.mjs --sign-ed25519 "$RUNNER_TEMP/release-private.pem"
          elif [ -n "${SIGN_KEY:-}" ]; then
            printf '%s' "$SIGN_KEY" > "$RUNNER_TEMP/release.key"
            node tools/release.mjs --sign-key "$RUNNER_TEMP/release.key"
          else
            node tools/release.mjs
          fi

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          NOTES="docs/releases/${VERSION}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber
