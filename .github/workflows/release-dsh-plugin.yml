name: Release DSH plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.1.2)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package plugin
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          zip -qr "dist/BridgeDeck-dsh-plugin-${VERSION}.zip" dsh-plugin
          sha256sum "dist/BridgeDeck-dsh-plugin-${VERSION}.zip" > "dist/BridgeDeck-dsh-plugin-${VERSION}.zip.sha256"

      - name: Ensure release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          NOTES="docs/releases/${VERSION}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

      - name: Upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/BridgeDeck-dsh-plugin-*.zip --clobber
