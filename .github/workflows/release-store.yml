name: release-store

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.3.1)
        required: true
      submit:
        description: Submit for review after upload
        type: choice
        options: [review, draft-only]
        default: review

permissions:
  contents: read

jobs:
  edge:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Release brand scan
        run: node tools/release-brand-scan.mjs

      - name: Build extension zip
        run: node tools/build-extension.mjs

      - name: Verify extension package
        run: node tools/verify-extension-package.mjs

      # 上传/提交统一走 tools/edge-publish.mjs：它同时发送 Authorization 与 X-ClientID，
      # 从 Location 头取 operationId 轮询，提交时把 certification notes 作为审核备注。
      - name: Upload and submit to Edge Add-ons
        shell: pwsh
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:EDGE_API_KEY -or -not $env:EDGE_CLIENT_ID -or -not $env:EDGE_PRODUCT_ID) {
            throw 'EDGE_API_KEY / EDGE_CLIENT_ID / EDGE_PRODUCT_ID secrets are required'
          }
          $zip = Get-ChildItem dist/BridgeDeck-extension-*.zip | Select-Object -First 1
          if (-not $zip) { throw 'extension zip not found' }
          $args = @('tools/edge-publish.mjs', '--package', $zip.FullName, '--notes-file', 'docs/assets/store/certification-notes-0.3.1.md')
          if ($env:SUBMIT -eq 'draft-only') { $args += '--draft-only' }
          node @args
