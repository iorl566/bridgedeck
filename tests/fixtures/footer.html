<!doctype html><meta charset="utf-8"><title>固定页脚夹具</title>
<body style="margin:0">
  <div style="height:15000px;background:linear-gradient(#e8f0ff,#c7dbff)">
    <div style="position:absolute;top:8px;left:8px">FOOTER PAGE TOP</div>
  </div>
  <div id="fixed-header" style="position:fixed;left:0;right:0;top:0;height:56px;background:#ffcc00;color:#222;font:600 18px sans-serif;display:flex;align-items:center;justify-content:center">FIXED HEADER</div>
  <div id="fixed-footer" style="position:fixed;left:0;right:0;bottom:0;height:80px;background:#123456;color:#fff;font:600 18px sans-serif;display:flex;align-items:center;justify-content:center">FIXED FOOTER</div>
</body>
