<!doctype html><meta charset="utf-8"><title>种子夹具</title>
<body style="margin:0;font:14px sans-serif">
  <h1>Seeded fixture</h1>
  <div id="seed-list"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const seed = params.get('seed') || '0';
    let state = 2166136261;
    for (const ch of seed) { state ^= ch.charCodeAt(0); state = Math.imul(state, 16777619); }
    const rand = () => {
      state = (state + 0x6D2B79F5) >>> 0;
      let t = state;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const list = document.getElementById('seed-list');
    for (let index = 0; index < 8; index += 1) {
      const value = Math.floor(rand() * 1000);
      const button = document.createElement('button');
      button.id = 'seed-item-' + index;
      button.type = 'button';
      button.textContent = seed + '-item-' + index + '-' + value;
      list.appendChild(button);
      list.appendChild(document.createTextNode(' '));
    }
    const input = document.createElement('input');
    input.id = 'seed-input';
    input.value = seed + '-value';
    list.appendChild(input);
  </script>
</body>
